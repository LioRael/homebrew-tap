name: Update Agent
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Agent version (without v)
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Generate a reviewed update branch
        env:
          AGENT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update-agent.py "$AGENT_VERSION"
          if git diff --quiet; then exit 0; fi
          branch="release/agent-$AGENT_VERSION"
          git switch --create "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/lenso-agent.rb
          git commit -m "chore: update Agent to $AGENT_VERSION"
          git push origin "$branch"
          gh pr create --title "chore: update Agent to $AGENT_VERSION" --body "Pin all native Agent artifacts to the published release checksums. Both platform installation checks must pass before merging."
          gh workflow run test.yml --ref "$branch"
